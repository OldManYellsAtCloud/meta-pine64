header:
  version: 11
  includes:
    - pine-common.yml

machine: pinephone-1-2

target: pinephone-swupdate

repos:
  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate
    refspec: "74532b19cb5939d39ca777264e1029534279e6f3"
    layers:
      .:

local_conf_header:
  pp: |
    PACKAGE_CLASSES = "package_ipk"
    INHERIT += "rm_work"
    DISTRO = "pp"
    DISTRO_FEATURES += " x11 systemd opengl wifi usbhost usbgadget bluetooth 3g pulseaudio pam wayland vulkan glvnd "
    EXTRA_DISTRO_FEATURES += " x11 systemd opengl wifi usbhost usbgadget bluetooth 3g pulseaudio pam wayland glvnd "

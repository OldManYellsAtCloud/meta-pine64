header:
  version: 11

repos:
  meta-oe:
    url: https://github.com/openembedded/meta-openembedded
    commit: "9af4488d46cb4fd4c0d2d64820c86225ebd6ac71"
    layers:
      meta-oe:
      meta-networking:
      meta-multimedia:
      meta-python:
      meta-gnome:
  oe-core:
    url: https://git.openembedded.org/openembedded-core.git
    commit: "06dd66e6220e5ce4ed4b9af4d8231ae5f0a8ce80"
    layers:
      meta:
  bitbake:
    url: https://git.openembedded.org/bitbake.git
    commit: "22021758e66737bcf68dfd2b74adc6a0cb1d42d9"
    layers:
      bitbake: excluded
  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    commit: "957df323"
    layers:
      meta-arm-toolchain:
      meta-arm:
      meta-arm-bsp:
  meta-pine64:
    layers:
      .:
  meta-browser:
    url: https://github.com/OSSystems/meta-browser.git
    commit: "e07817d8f8ada5340347c34f1ac6d5ee68eaa5ff"
    layers:
      meta-firefox:
  meta-wayland:
    url: https://codeberg.org/flk/meta-wayland.git
    commit: "3634f036df19b952fc78efb15381bf9e79c293b2"
    layers:
      .:
  meta-qt:
    url: https://code.qt.io/yocto/meta-qt6.git
    commit: "c76c5dee65459f168623296d1d4e29f1199afcd9"
    layers:
      .:

local_conf_header:
  meta-pine64: |
    IMAGE_FSTYPES += "wic.bz2 wic.bmap"
    LICENSE_FLAGS_ACCEPTED += "commercial"
    PREFERRED_VERSION_firefox = "150%"
    HOSTTOOLS += "rpm pkgconf"
    BB_GENERATE_MIRROR_TARBALLS = "1"
    DL_DIR = "/yocto/yocto_dl"
